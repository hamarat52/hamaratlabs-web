<!DOCTYPE html>
<html lang="tr">
<head>
  <base href="3fdcf2c5/">
  <meta charset="UTF-8">
  <!-- Mobil: cihaz genişliği, pinch-zoom kapalı (oyun alanı tüm dokunuşları kullanır) -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Düşen Top v2</title>
  <style>
    html, body {
      margin: 0; padding: 0; background: #000; height: 100%; overflow: hidden;
      touch-action: none; overscroll-behavior: none;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    }
    body { height: 100dvh; display: flex; align-items: center; justify-content: center; }
    #game { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }
    /* Boyut main.js'te tam sayı ölçekle (cihaz pikseli) atanır; büyütme en yakın komşu. */
    canvas {
      display: block; touch-action: none;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      image-rendering: pixelated;
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
