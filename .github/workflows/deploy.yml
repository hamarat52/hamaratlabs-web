# main'e her push'ta siteyi derleyip GitHub Pages'e yayınlar.
name: Yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # hamaratlabs.com bağlandı (19 Ekim) — artık alan adının kökünde yayında.
      - run: npm run build
        env:
          BASE_PATH: /
      # Cloudflare Pages'e yayınlar. 404.html bu adımdan SONRA eklenir: Cloudflare Pages kökte
      # 404.html görmezse SPA kipine geçer, /uretiyorum/sesver gibi derin rotalar soğuk açılışta 200 döner.
      # (_redirects içindeki "/* /index.html 200" kuralını Pages sonsuz döngü sayıp yok sayıyor, denendi.)
      - name: Cloudflare Pages'e yayınla
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=hamaratlabs-web --branch=main
      # GitHub Pages (DNS geçişine kadar köken): derin rotalar 404.html + JS ile açılır.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
