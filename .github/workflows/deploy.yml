# main'e her push'ta siteyi derleyip Cloudflare Pages'e (hamaratlabs-web projesi) yayınlar.
# hamaratlabs.com ve www Cloudflare Pages projesine bağlı; GitHub Pages kullanılmıyor.
name: Yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /
      # RICAMBIO (Okul Projeleri): landing ve platform kendi public repolarından derlenip
      # dist/okul-projeleri/ricambio/ ve .../ricambio/app/ altına kopyalanır.
      # İki repo güvenlik kontrolünden geçmiş commit'e sabit (siberguvenlik 2026-11-03, Z1).
      # Repolar değişince: aşağıdaki iki ref'i yeni SHA ile güncelle, siberguvenlik kontrolü al,
      # main'e push et (ya da Actions > Yayınla > Run workflow). SHA değişmeden Run workflow aynı sürümü derler.
      - name: RICAMBIO landing'i al
        uses: actions/checkout@v4
        with:
          repository: hamarat52/ricambio-landing
          ref: beccba47f87718d381ca760930ae10f2f14ddc12
          path: _ricambio/landing
          persist-credentials: false
      - name: RICAMBIO platformunu al
        uses: actions/checkout@v4
        with:
          repository: hamarat52/ricambio-platform
          ref: b7f5025db3d5f8b788f1bf6739c8034f464e4c67
          path: _ricambio/platform
          persist-credentials: false
      - run: npm ci && npm run build
        working-directory: _ricambio/landing
      - run: npm ci && npm run build:site
        working-directory: _ricambio/platform
      - name: RICAMBIO'yu siteye ekle
        run: |
          mkdir -p dist/okul-projeleri/ricambio/app
          cp -r _ricambio/landing/dist/. dist/okul-projeleri/ricambio/
          cp -r _ricambio/platform/dist-site/. dist/okul-projeleri/ricambio/app/
      # dist/404.html KOYMA: Cloudflare Pages kökte 404.html görmezse SPA kipine geçer,
      # /uretiyorum/sesver gibi derin rotalar soğuk açılışta 200 döner. Statik dosyalar önceliklidir.
      - name: Cloudflare Pages'e yayınla
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=hamaratlabs-web --branch=main
